<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedEase - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="container-fluid">
      <div class="logo-row d-flex align-items-center justify-content-center gap-3 py-3">
        <img class="logo rounded-circle" src="images/logo.png" alt="MedEase logo" width="70" height="70">
        <h1 class="mb-0">MedEase</h1>
      </div>
    </div>
  </header>

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container">
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item">
            <a class="nav-link" href="index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="catalogue.html">Catalogue</a>
          </li>
          <li class="nav-item">
            <a class="nav-link active" href="login.html">Login</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="register.html">Register</a>
          </li>
        </ul>
        <div class="input-group w-25">
          <input type="text" class="form-control" placeholder="Search medicines...">
          <button class="btn btn-outline-light" type="button">
            <i class="bi bi-search">Search</i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <div class="container center-page">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form id="loginForm" class="p-4 border rounded bg-white">
          <h2 class="mb-4">Login</h2>
          
          <div class="alert alert-warning alert-dismissible fade show" role="alert">
            Enter your registered email and password.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
          </div>
          
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>

          <p class="error text-danger" id="loginError"></p>

          <button type="submit" class="btn btn-primary">Login</button>
        </form>
      </div>
    </div>
    
    <nav aria-label="Page navigation" class="mt-5">
      <ul class="pagination justify-content-center">
        <li class="page-item disabled">
          <a class="page-link" href="#" tabindex="-1">Previous</a>
        </li>
        <li class="page-item active"><a class="page-link" href="#">1</a></li>
        <li class="page-item"><a class="page-link" href="#">2</a></li>
        <li class="page-item"><a class="page-link" href="#">3</a></li>
        <li class="page-item">
          <a class="page-link" href="#">Next</a>
        </li>
      </ul>
    </nav>
  </div>

  <footer class="bg-primary text-white text-center py-3 mt-4">
    <div class="container">
      <p class="mb-0">MedEase Pharmacy</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
