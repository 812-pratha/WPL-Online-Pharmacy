<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>MedEase - Catalogue</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo-row">
      <img class="logo" src="images/logo.png" alt="MedEase logo">
      <h1>MedEase</h1>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="login.html">Login</a>
    <a href="register.html">Register</a>
  </nav>

  <div class="container">
    <h2>Medicine Catalogue</h2>
    <div class="product-grid">

      <div class="product-card">
        <img src="images/paracetamol.jpg" alt="Paracetamol">
        <h3>Paracetamol</h3>
        <p class="price">Rs. 20</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="product-card">
        <img src="images/ibuprofen.jpg" alt="Ibuprofen">
        <h3>Ibuprofen</h3>
        <p class="price">Rs. 35</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="product-card">
        <img src="images/cetirizine.jpg" alt="Cetirizine">
        <h3>Cetirizine</h3>
        <p class="price">Rs. 15</p>
        <button class="buy-btn">Buy</button>
      </div>

      <div class="product-card">
        <img src="images/amoxicillin.jpg" alt="Amoxicillin">
        <h3>Amoxicillin</h3>
        <p class="price">Rs. 50</p> 
        <button class="buy-btn">Buy</button>
      </div>

      <div class="product-card">
        <img src="images/vitamin-c.jpg" alt="Vitamin C Tablets">
        <h3>Vitamin C Tablets</h3>
        <p class="price">Rs. 40</p>
        <button class="buy-btn">Buy</button>
      </div>

    </div>
  </div>

  <footer>
    <p>MedEase Pharmacy</p>
  </footer>

</body>
</html>
